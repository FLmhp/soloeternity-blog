name: Deploy Blog

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-blog
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.9'
  REMOTE_ROOT: /var/www/blog
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Validate deployment secrets
        env:
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          for name in CLOUDFLARE_CACHE_PURGE_TOKEN CLOUDFLARE_ZONE_ID SSH_HOST SSH_KNOWN_HOSTS SSH_PORT SSH_PRIVATE_KEY SSH_USER; do
            test -n "${!name}" || { echo "Missing required secret: ${name}" >&2; exit 1; }
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/blog-deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/blog-deploy ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host blog-origin
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/blog-deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload immutable release
        run: |
          ssh blog-origin "mkdir -p '${REMOTE_ROOT}/releases/${GITHUB_SHA}'"
          rsync -az --delete --exclude='*.map' public/ "blog-origin:${REMOTE_ROOT}/releases/${GITHUB_SHA}/"

      - name: Activate release atomically
        run: |
          ssh blog-origin sh -s -- "$REMOTE_ROOT" "$GITHUB_SHA" <<'REMOTE'
          set -eu
          root=$1
          release="$root/releases/$2"
          test -f "$release/index.html"
          find "$release" -type d -exec chmod 755 {} +
          find "$release" -type f -exec chmod 644 {} +
          touch "$release"
          previous=$(readlink "$root/current" || true)
          if [ -n "$previous" ]; then
            ln -sfn "$previous" "$root/previous.next"
            mv -Tf "$root/previous.next" "$root/previous"
          fi
          ln -sfn "$release" "$root/current.next"
          mv -Tf "$root/current.next" "$root/current"
          REMOTE

      - name: Verify deployment and roll back on failure
        run: |
          if ! curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "https://soloeternity.me/?deploy=${GITHUB_SHA}" >/dev/null; then
            ssh blog-origin sh -s -- "$REMOTE_ROOT" <<'REMOTE'
            set -eu
            root=$1
            previous=$(readlink "$root/previous")
            ln -sfn "$previous" "$root/current.next"
            mv -Tf "$root/current.next" "$root/current"
            REMOTE
            exit 1
          fi

      - name: Purge Cloudflare HTML cache
        env:
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            --header "Authorization: Bearer ${CLOUDFLARE_CACHE_PURGE_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"hosts":["soloeternity.me"]}' \
            | jq --exit-status '.success == true' >/dev/null

      - name: Keep the three newest releases
        run: |
          ssh blog-origin sh -s -- "$REMOTE_ROOT" <<'REMOTE'
          set -eu
          root=$1
          set -- "$root"/releases/*
          [ -e "$1" ] || exit 0
          ls -1dt -- "$root"/releases/* | tail -n +4 | xargs -r rm -rf --
          REMOTE
